  name: Marcus Consumer Data Access (Aggregator-Only)
  description: >-
    Marcus by Goldman Sachs does not publish a first-party consumer developer API.
    Consumer-permissioned account data is available only through third-party
    open-finance aggregators. Plaid supports Marcus with the Assets, Auth, Balance,
    Transactions, and Investments products across Depository, Loan, Investment, and
    Other account types (US only). This entry is an honest data-access pointer, not a
    Marcus-operated API.
