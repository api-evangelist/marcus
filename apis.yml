name: Marcus by Goldman Sachs
kind: company
description: >-
  Marcus by Goldman Sachs is the U.S. consumer banking brand of The Goldman Sachs
  Group, launched in 2016 to offer no-fee high-yield Online Savings Accounts and
  Certificates of Deposit (CDs) directly to retail customers online. Deposits are
  held at Goldman Sachs Bank USA, a New York State-chartered bank and member of the
  Federal Reserve System, insured by the FDIC. After Goldman's broad retreat from
  consumer lending, Marcus no longer originates personal loans and now centers on
  digital deposit products. Marcus operates NO public first-party consumer developer
  API and runs no self-serve developer portal for its retail banking products; the
  Goldman Sachs Developer platform (developer.gs.com) serves institutional Transaction
  Banking and Marquee offerings, not Marcus consumer banking. Consumer-permissioned
  account data (balances, transactions, account/holder info) is reachable only through
  third-party open-finance aggregators such as Plaid, Flinks, and MX, not a documented
  Marcus API. As a bank chartered in the U.S., Goldman Sachs Bank USA is subject to the
  emerging CFPB Section 1033 personal financial data rights framework, but no first-party
  FDX-conformant Marcus developer interface is publicly documented as of this record.
